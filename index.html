<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body{
    font-family: Arial, Helvetica, sans-serif;
    background-color: #e9e1dc;
    color: #292525;
}
.ramkaran{
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 25px 10px;
}
.ramkaran a{
    text-decoration: none;
    color: #292525;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
}
.container{
    max-width: 1100px;
    margin: 20px auto;
    padding: 10px;
}
.profile-card{
    border: 1px solid #8c817a;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
}
.profile-info{
    flex: 1;
    padding: 20px;
}
.profile-info p{
    font-size: 18px;
    line-height: 1.6;
    margin-bottom: 25px;

}
.profile-info h1{
    font-size: 48px;
    font-weight: normal;
    margin-bottom: 15px;
}
.username{ 
    font-size: 13px;
font-weight: bold;
margin-top: 70px;
margin-bottom: 15px;
}
.profile-image{
    flex: 1;
    max-width: 450px;
}
.profile-image img{
    width: 100%;
    height: 380px;
    object-fit: cover;
    display: block;
}
.social-icons{
    display: flex;
    gap: 18px;
    align-items: center;
}
.social-icons a{
    color: #292525;
    text-decoration: none;
    font-size: 22px;
    font-weight: bold;
}


    </style>
</head>
<body>

</body>
